{% set name = "pwdlib" %}
{% set version = "0.3.0" %}


package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 6ca30f9642a1467d4f5d0a4d18619de1c77f17dfccb42dd200b144127d3c83fc

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - hatchling
    - hatch-regex-commit
    - pip
    - python {{ python_min }}

  run:
    - python >={{ python_min }}

test:
  imports:
    - pwdlib
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/frankie567/pwdlib
  summary: Modern password hashing for Python.
  doc_url: https://frankie567.github.io/pwdlib
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - davidbrochart
    - frankie567
    - thewchan
