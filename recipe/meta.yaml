{% set name = "pwdlib" %}
{% set version = "0.4.2" %}


package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 8f74cfd9c602982a9a05240c5b6484e384d732a891fd3c44befba2be9c4a4748

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - hatchling
    - hatch-regex-commit
    - pip
    - python {{ python_min }}

  run:
    - python >={{ python_min }}

test:
  imports:
    - pwdlib
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/frankie567/pwdlib
  summary: Modern password hashing for Python.
  doc_url: https://frankie567.github.io/pwdlib
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - davidbrochart
    - frankie567
    - thewchan
